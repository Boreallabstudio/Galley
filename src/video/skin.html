<media-container class="media-skin asc" data-theme="ascent" data-preset="video" tabindex="-1">
<!-- Add a compatible media component here. -->
<media-poster class="asc-poster">
<img alt="" decoding="async" class="asc-poster-image">
</media-poster>
<div class="asc-shade" aria-hidden="true"></div>
<ascent-captions class="asc-cap"></ascent-captions>
<media-time-slider class="asc-seek" step="5">
<media-slider-thumb class="asc-seek-thumb"></media-slider-thumb>
<media-time-slider-chapter-title class="asc-visually-hidden"></media-time-slider-chapter-title>
</media-time-slider>
<ascent-flight class="asc-svg"></ascent-flight>
<div class="asc-fade">
<div class="asc-title">
<media-title class="lab"></media-title>
<span class="lab asc-byline" data-asc-byline></span>
</div>
<ascent-now class="asc-now"></ascent-now>
<ascent-events class="asc-events"></ascent-events>
<ascent-board class="asc-board"></ascent-board>
<div class="asc-row">
<div class="asc-mod">
<i class="asc-mh" aria-hidden="true">Flight</i>
<media-play-button class="asc-b play">
<svg class="asc-i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4.5v15l12-7.5z"/></svg>
<svg class="asc-i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 4.6h3.8v14.8H6.4zM13.8 4.6h3.8v14.8h-3.8z"/></svg>
<svg class="asc-i-replay" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8.25A7.5 7.5 0 1 1 4.5 12"/><path d="M5.5 3.8v4.45h4.45"/></svg>
<ascent-play-label class="asc-kl" aria-hidden="true"></ascent-play-label>
<span class="asc-tip" aria-hidden="true">Play or pause <kbd>Space</kbd></span>
</media-play-button>
</div>
<div class="asc-mod">
<i class="asc-mh" aria-hidden="true">Propulsion</i>
<span class="asc-wrap vol">
<media-mute-button class="asc-b mute">
<i aria-hidden="true"></i>
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5v5h3.2l4.3 3.6V5.9L6.2 9.5H3Z"/><path class="asc-i-on" d="M15 9.2a4 4 0 0 1 0 5.6M18 6.6a7.6 7.6 0 0 1 0 10.8"/><path class="asc-i-off" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg>
</media-mute-button>
<ascent-engine class="asc-pop" kind="volume" size="pop">
<media-volume-slider class="asc-thr-hit">
<media-slider-thumb class="asc-thr-thumb"></media-slider-thumb>
</media-volume-slider>
</ascent-engine>
</span>
<ascent-engine class="asc-jet vol" kind="volume" size="jet">
<media-volume-slider class="asc-thr-hit">
<media-slider-thumb class="asc-thr-thumb"></media-slider-thumb>
</media-volume-slider>
<span class="asc-tip" aria-hidden="true">Volume: turn or scroll <kbd>↑</kbd><kbd>↓</kbd></span>
</ascent-engine>
<span class="asc-wrap spd">
<media-playback-rate-button class="asc-b rate">
<ascent-rate aria-hidden="true"></ascent-rate>
</media-playback-rate-button>
<ascent-engine class="asc-pop" kind="speed" size="pop"></ascent-engine>
</span>
<ascent-engine class="asc-jet spd" kind="speed" size="jet">
<span class="asc-tip" aria-hidden="true">Speed: turn or scroll <kbd>&lt;</kbd><kbd>&gt;</kbd></span>
</ascent-engine>
</div>
<div class="asc-mod">
<i class="asc-mh" aria-hidden="true">Comms</i>
<media-captions-button class="asc-b cc">
<i aria-hidden="true"></i>
<span class="asc-tip" aria-hidden="true">Captions <kbd>C</kbd></span>
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5h18v13H3zM10.6 10.4a2.2 2.2 0 1 0 0 3.2M17 10.4a2.2 2.2 0 1 0 0 3.2"/></svg>
</media-captions-button>
</div>
<div class="asc-mod">
<i class="asc-mh" aria-hidden="true">Screen</i>
<media-fullscreen-button class="asc-b full">
<i aria-hidden="true"></i>
<span class="asc-tip" aria-hidden="true">Full screen <kbd>F</kbd></span>
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
</media-fullscreen-button>
</div>
<ascent-next class="asc-mod seq"></ascent-next>
<div class="asc-mod clk">
<ascent-clock class="asc-clock"></ascent-clock>
</div>
</div>
</div>
<media-buffering-indicator class="asc-load">
<span>Hold · buffering</span>
</media-buffering-indicator>
<media-error-dialog>
<media-dialog-backdrop class="asc-dialog-backdrop">
</media-dialog-backdrop>
<media-dialog-popup class="asc-dialog">
<span class="lab asc-dialog-kicker" aria-hidden="true">Signal lost</span>
<media-dialog-title class="lab asc-dialog-title">
</media-dialog-title>
<media-dialog-description class="asc-dialog-description">
</media-dialog-description>
<media-dialog-close class="asc-dialog-close">
</media-dialog-close>
</media-dialog-popup>
</media-error-dialog>
<media-hotkey keys="Space" action="togglePaused"></media-hotkey>
<media-hotkey keys="k" action="togglePaused"></media-hotkey>
<media-hotkey keys="m" action="toggleMuted"></media-hotkey>
<media-hotkey keys="c" action="toggleSubtitles"></media-hotkey>
<media-hotkey keys="f" action="toggleFullscreen"></media-hotkey>
<media-hotkey keys="ArrowLeft" action="seekStep" value="-5"></media-hotkey>
<media-hotkey keys="ArrowRight" action="seekStep" value="5"></media-hotkey>
<media-hotkey keys="ArrowUp" action="volumeStep" value="0.05"></media-hotkey>
<media-hotkey keys="ArrowDown" action="volumeStep" value="-0.05"></media-hotkey>
<media-hotkey keys="Home" action="seekToPercent" value="0"></media-hotkey>
<media-hotkey keys="End" action="seekToPercent" value="100"></media-hotkey>
<media-hotkey keys="PageUp" action="seekStep" value="30" data-asc-tenth="1"></media-hotkey>
<media-hotkey keys="PageDown" action="seekStep" value="-30" data-asc-tenth="-1"></media-hotkey>
<media-hotkey keys="<" action="speedDown"></media-hotkey>
<media-hotkey keys="," action="speedDown"></media-hotkey>
<media-hotkey keys=">" action="speedUp"></media-hotkey>
<media-hotkey keys="." action="speedUp"></media-hotkey>
<ascent-keys></ascent-keys>
<ascent-lift></ascent-lift>
<media-status-announcer class="asc-visually-hidden">
</media-status-announcer>
</media-container>
